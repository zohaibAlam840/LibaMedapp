  <path d="M15,22 h5 v15 h8 v5 h-13 z" fill="#fff"/>
  <path d="M30,42 v-20 h4 l6,10 l6,-10 h4 v20 h-5 v-11 l-5,8 l-5,-8 v11 z" fill="#fff"/>
</svg>
