<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · LibaMed</title>
    <style>
      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
        color: #171717;
        background: #ffffff;
      }
      main { max-width: 28rem; }
      h1 { font-size: 1.25rem; margin-bottom: 0.5rem; }
      p { color: #555; line-height: 1.5; }
    </style>
  </head>
  <body>
    <!-- Static PWA offline shell. Contains NO patient data. -->
    <main>
      <h1>You&rsquo;re offline</h1>
      <p>
        LibaMed needs a connection to load securely. Patient data is never stored
        on this device. Please reconnect and try again.
      </p>
    </main>
  </body>
</html>
